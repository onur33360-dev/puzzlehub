# ═══════════════════════════════════════════════════════════════════════
#  SlySwipe — Codemagic iOS derleme hattı
# ═══════════════════════════════════════════════════════════════════════
#
# NEDEN VAR: iOS derlemesi macOS + Xcode gerektiriyor, bu makinede ikisi
# de yok. Codemagic buluttaki bir Mac'te derleyip İMZALI .ipa üretiyor.
#
# İKİ İŞ AKIŞI, ve ayrımın sebebi var:
#   ios-ipa         — yalnız imzalı .ipa üretir, hiçbir yere yüklemez.
#                     İLK KOŞUM BUNUNLA YAPILMALI: "imzalama ve derleme
#                     doğru mu" sorusunu, "App Store Connect'te uygulama
#                     kaydı var mı" sorusundan AYIRIYOR. İkisi tek adımda
#                     denenirse başarısız bir koşumun hangisinden
#                     kaynaklandığı belirsiz kalır.
#   ios-testflight  — aynı derleme + TestFlight'a yükleme. App Store
#                     Connect'te aynı bundle id ile uygulama kaydı
#                     OLUŞTURULDUKTAN SONRA kullanılmalı.
#
# ── ÖNCE CODEMAGIC ARAYÜZÜNDE YAPILMASI GEREKENLER ────────────────────
# 1. Teams > Integrations > App Store Connect: .p8 anahtarı yüklenir.
#    Anahtarın ADI aşağıdaki `app_store_connect:` değeriyle HARF HARF
#    aynı olmalı — uyuşmazsa hata "integration not found" der ve bu bir
#    imzalama hatası gibi görünmez.
# 2. Apple Developer Portal'da bundle id kayıtlı olmalı:
#    com.skyroonlabs.slyswipe
#
# ── SÜRÜM NUMARASI ────────────────────────────────────────────────────
# MARKETING_VERSION, index.html'deki APP_VERSION'dan TÜRETİLİYOR. Bu
# projede sürüm tek kaynaktan gelir: android/app/build.gradle'daki
# versionName de aynı değeri taşıyor, çünkü bir hata raporundaki sürümün
# hangi koda denk geldiği sorusunun cevabı olmalı. iOS'un kendi 1.0'ını
# bırakmak o zinciri kırardı.
#
# CURRENT_PROJECT_VERSION ise Codemagic'in kendi sayacından
# ($PROJECT_BUILD_NUMBER) geliyor. App Store Connect aynı sürüm için aynı
# build numarasını İKİNCİ KEZ kabul etmiyor; makine tarafından artırılan
# bir sayaç bunu elle takip etmekten daha güvenilir.

definitions:
  # YAML çapası: iki iş akışı da aynı ortamı ve aynı adımları kullanıyor.
  # Kopyalamak yerine çapa kullanmanın sebebi, birinde düzeltilip
  # diğerinde unutulan bir adımın sessizce farklı iki derleme üretmesi.
  env_ios: &env_ios
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.skyroonlabs.slyswipe
    # xcode: latest — sabitlemek yeniden üretilebilirlik açısından daha
    # iyi olurdu, ama var olmayan bir sürüm yazmak koşumu daha ilk
    # adımda düşürüyor. İlk yeşil koşumdan sonra buraya o koşumun
    # kullandığı kesin sürüm yazılmalı.
    xcode: latest
    cocoapods: default
    node: 20
    vars:
      XCODE_WORKSPACE: "ios/App/App.xcworkspace"
      XCODE_SCHEME: "App"
      BUNDLE_ID: "com.skyroonlabs.slyswipe"

  cache_ios: &cache_ios
    cache_paths:
      - $HOME/Library/Caches/CocoaPods
      - $CM_BUILD_DIR/node_modules

  scripts_ios: &scripts_ios
    - name: Bağımlılıklar (npm ci)
      script: |
        npm ci

    - name: Node koşumları — i18n doğrulaması
      script: |
        # Derlemeden ÖNCE koşuyor: eksik bir çeviri anahtarı ya da bütçe
        # aşan sabit metin, imzalı bir .ipa üretildikten sonra öğrenilecek
        # bir şey değil. Bu araçlar sıfır bağımlılıklı düz Node.
        node tools/i18n-test.js

    - name: Web varlıkları + cap sync ios
      script: |
        # npm run sync:ios = build-www.js + cap sync ios.
        # `npx cap sync` DOĞRUDAN çağrılmıyor: o, www/'yi yeniden
        # üretmeden kopyalar, yani orada duran bayat bir anlık görüntüyü
        # seve seve paketler. Tek doğru giriş noktası npm scripti.
        # cap sync ios ayrıca pod install'ı da çalıştırıyor.
        npm run sync:ios

    - name: Sürüm damgası (MARKETING_VERSION + build no)
      script: |
        set -e
        APP_VERSION=$(grep -o "APP_VERSION = '[^']*'" index.html | head -1 | sed "s/.*'\(.*\)'/\1/")
        if [ -z "$APP_VERSION" ]; then
          echo "HATA: index.html içinde APP_VERSION bulunamadı."
          exit 1
        fi
        echo "APP_VERSION = $APP_VERSION / build = $PROJECT_BUILD_NUMBER"

        PBX="ios/App/App.xcodeproj/project.pbxproj"

        # agvtool KULLANILMIYOR: bu proje apple-generic sürümleme ile
        # kurulmadı (pbxproj'de VERSIONING_SYSTEM yok), agvtool orada
        # sessizce hiçbir şey yapmıyor. Doğrudan yazıp DOĞRULUYORUZ.
        sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" "$PBX"
        sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/g" "$PBX"

        # Sessiz başarısızlık en pahalı sonuç olurdu: yanlış sürümle
        # imzalanmış bir .ipa geçerli görünür ve TestFlight'ta "bu build
        # zaten var" diye reddedilir. O yüzden yazdığımızı geri okuyoruz.
        grep -q "MARKETING_VERSION = $APP_VERSION;" "$PBX" || { echo "HATA: MARKETING_VERSION yazılamadı"; exit 1; }
        grep -q "CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;" "$PBX" || { echo "HATA: CURRENT_PROJECT_VERSION yazılamadı"; exit 1; }
        echo "Sürüm damgası doğrulandı."

    - name: İmzalama profillerini projeye uygula
      script: |
        # Codemagic, environment.ios_signing'e göre sertifika ve profili
        # makineye indiriyor; bu komut onları Xcode projesine yazıyor.
        # Atlanırsa derleme "no signing certificate" ile düşer.
        xcode-project use-profiles

    - name: IPA derle
      script: |
        xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME"

  artifacts_ios: &artifacts_ios
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

workflows:

  # ── 1. ADIM: yalnız imzalı .ipa ──────────────────────────────────────
  ios-ipa:
    name: SlySwipe iOS — imzalı IPA (yükleme yok)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SlySwipe ASC
    environment: *env_ios
    cache: *cache_ios
    scripts: *scripts_ios
    artifacts: *artifacts_ios
    publishing:
      email:
        recipients:
          - onur33360@gmail.com
        notify:
          success: true
          failure: true

  # ── 2. ADIM: aynı derleme + TestFlight ───────────────────────────────
  ios-testflight:
    name: SlySwipe iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SlySwipe ASC
    environment: *env_ios
    cache: *cache_ios
    scripts: *scripts_ios
    artifacts: *artifacts_ios
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # App Store'a (incelemeye) gönderme BİLEREK kapalı. TestFlight iç
        # test App Review'dan geçmiyor; mağaza yayını ayrı ve geri
        # alınması zor bir adım, otomatik hattın sonunda olmamalı.
        submit_to_app_store: false
      email:
        recipients:
          - onur33360@gmail.com
        notify:
          success: true
          failure: true

  # ── App Store ekran görüntüsü çekimi ────────────────────────────────
  #
  # Diğer iki iş akışından TAMAMEN AYRI yazıldı ve onlarla hiçbir çapa
  # paylaşmıyor. Sebep: env_ios `ios_signing` taşıyor, burada ise imzalama
  # ne gerekli ne de istenir — simulator derlemesi imzasız yapılır ve bu
  # iş akışı hiçbir yere yükleme yapmaz. Paylaşılan çapayı kullanmak,
  # ekran görüntüsü almak için App Store Connect entegrasyonunu zorunlu
  # kılardı.
  #
  # ── ÖNEMLİ: VNC (uzaktan erişim) ELLE AÇILMALI ─────────────────────
  # Bu iş akışı, insanın simulator'ı elle kullanmasına dayanıyor. Codemagic
  # arayüzünde "Start new build" penceresinde **Enable remote access**
  # işaretlenmeden başlatılırsa bağlanılacak bir ekran olmaz: derleme
  # yapılır, 45 dakika DONE bekler ve hiçbir görüntü alınmadan biter.
  # yaml'dan açılabilen bir ayar değil, bu yüzden burada yazılı.
  ios-screenshots:
    name: SlySwipe iOS — App Store Screenshots
    instance_type: mac_mini_m2
    # 45 dakikalık elle çalışma + derleme + pod install. Süre buna göre;
    # diğer iş akışlarının 60'ı burada yetmez.
    max_build_duration: 90
    environment:
      # ios_signing YOK ve integrations YOK — bilerek.
      #
      # xcode/cocoapods/node değerleri env_ios ile AYNI olmak zorunda:
      # aynı Xcode hattı, aynı pod çözümü. Çapa paylaşılmadığı için bu
      # eşitlik elle korunuyor — env_ios'taki `xcode:` değeri
      # değiştirilirse buradaki de aynı turda değiştirilmeli, yoksa ekran
      # görüntüleri yayınlanan derlemeden farklı bir derlemeden gelir.
      xcode: latest
      cocoapods: default
      node: 20
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.skyroonlabs.slyswipe"
        SIM_DEVICE: "iPhone 12 Pro Max"
        # App Store Connect'in 6.5" alanı bu dikey boyutu kabul ediyor ve
        # iPhone 12 Pro Max'in native çözünürlüğü buna birebir uyuyor.
        EXPECT_W: "1284"
        EXPECT_H: "2778"
        SHOTS_DIR: "screenshots"
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Bağımlılıklar (npm ci)
        script: |
          npm ci

      - name: Web varlıkları + cap sync ios
        script: |
          # Diğer iş akışlarıyla aynı güvenli yol: npm run sync:ios =
          # build-www.js + cap sync ios (pod install dahil). `npx cap sync`
          # doğrudan çağrılmıyor — o, www/ klasörünü yeniden üretmeden
          # kopyalar, yani orada duran bayat bir anlık görüntüyü paketler.
          npm run sync:ios

      - name: Simulator cihazını hazırla (iPhone 12 Pro Max)
        script: |
          set -e

          # Zaten var mı? `available` filtresi, çalışma zamanı silinmiş
          # hayalet cihazları eliyor — onlara boot denemek anlamsız bir
          # hata veriyor.
          UDID=$(xcrun simctl list devices available \
                 | grep -E "^[[:space:]]+${SIM_DEVICE} \(" \
                 | head -1 \
                 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')

          if [ -z "$UDID" ]; then
            echo "${SIM_DEVICE} mevcut degil; bu Xcode altinda olusturulabilir mi bakiliyor."

            DEVICE_TYPE=$(xcrun simctl list devicetypes \
                          | grep -F "${SIM_DEVICE} (" \
                          | sed -E 's/.*\((com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+)\).*/\1/' \
                          | head -1)
            RUNTIME=$(xcrun simctl list runtimes \
                      | grep -o 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]*' \
                      | tail -1)

            if [ -z "$DEVICE_TYPE" ] || [ -z "$RUNTIME" ]; then
              # ACIK HATA: rastgele baska bir cihaza dusmek YOK. Farkli
              # cozunurlukte bir cihaz, App Store'un reddedecegi ekran
              # goruntusu uretir ve bunu ancak yukleme aninda ogrenirdik.
              echo ""
              echo "HATA: ${SIM_DEVICE} bu Xcode surumunde olusturulamiyor."
              echo "  device type : ${DEVICE_TYPE:-BULUNAMADI}"
              echo "  runtime     : ${RUNTIME:-BULUNAMADI}"
              echo ""
              echo "Yeni Xcode surumleri eski cihaz tiplerini kaldiriyor."
              echo "Bilerek baska bir cihaza DUSMUYORUZ. Sonraki adim bir"
              echo "insan karari: ayni 1284x2778 cozunurlugu iPhone 14/15/16"
              echo "Plus da veriyor, ya da environment icindeki xcode degeri"
              echo "bu cihazi hala tasiyan bir hatta sabitlenebilir."
              echo ""
              echo "Mevcut iPhone cihaz tipleri:"
              xcrun simctl list devicetypes | grep -i iphone || true
              exit 1
            fi

            echo "Olusturuluyor: ${SIM_DEVICE} / ${DEVICE_TYPE} / ${RUNTIME}"
            UDID=$(xcrun simctl create "${SIM_DEVICE}" "$DEVICE_TYPE" "$RUNTIME")
          fi

          echo "Simulator UDID: $UDID"
          # Sonraki adimlar ayri kabuklar — degisken dosyaya yaziliyor.
          echo "$UDID" > "$CM_BUILD_DIR/.sim_udid"

      - name: Simulator icin Debug derle (imzasiz)
        script: |
          set -e
          UDID=$(cat "$CM_BUILD_DIR/.sim_udid")

          # CODE_SIGNING_ALLOWED=NO: simulator derlemesi imza istemez ve
          # istememeli — bu is akisinin sertifika/profil gerektirmemesinin
          # tek sebebi bu satir.
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$CM_BUILD_DIR/ios/simbuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

          APP_PATH="$CM_BUILD_DIR/ios/simbuild/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "HATA: derlenen .app bulunamadi: $APP_PATH"
            exit 1
          fi
          echo "$APP_PATH" > "$CM_BUILD_DIR/.sim_app"
          echo "Derlendi: $APP_PATH"

      - name: Simulator baslat, uygulamayi kur ve ac
        script: |
          set -e
          UDID=$(cat "$CM_BUILD_DIR/.sim_udid")
          APP_PATH=$(cat "$CM_BUILD_DIR/.sim_app")

          # bootstatus -b: kapaliysa acar ve acilis BITENE KADAR bekler.
          # Beklemeden install etmek "device not booted" ile dusuyor.
          xcrun simctl bootstatus "$UDID" -b

          # GUI: VNC ile baglanan insanin gorecegi pencere bu.
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true

          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          echo "Uygulama acildi: $BUNDLE_ID"

      - name: Ekran goruntusu klasoru + talimat
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/$SHOTS_DIR"

          # Onceki bir kosumdan/cache'ten kalan DONE, bekleme adimini
          # aninda gecirip hic goruntu almadan bitmesine yol acardi.
          rm -f "$CM_BUILD_DIR/$SHOTS_DIR/DONE"

          echo ""
          echo "==========================================================="
          echo "  VNC ile Simulator'da istedigin ekrana git."
          echo "==========================================================="
          echo ""
          echo "Ekran goruntusu almak icin (Mac uzerinde bir terminalde):"
          echo ""
          echo "  xcrun simctl io booted screenshot \"$CM_BUILD_DIR/$SHOTS_DIR/01-discover.png\""
          echo ""
          echo "Sonraki goruntuler icin ayni komut, yalniz dosya adi degisir:"
          echo "  02-arcade.png"
          echo "  03-ufo.png"
          echo "  04-block.png"
          echo "  05-flow.png"
          echo "  06-wordsearch.png"
          echo ""
          echo "Is bitince:"
          echo ""
          echo "  touch \"$CM_BUILD_DIR/$SHOTS_DIR/DONE\""
          echo ""
          echo "==========================================================="
          echo "Klasor          : $CM_BUILD_DIR/$SHOTS_DIR"
          echo "Beklenen boyut  : ${EXPECT_W}x${EXPECT_H} (dikey)"
          echo "DONE bekleme    : en fazla 45 dakika"
          echo "==========================================================="
          echo ""

      - name: DONE bekle (en fazla 45 dakika)
        script: |
          # SINIRLI dongu: sonsuz bekleme makineyi max_build_duration
          # dolana kadar tutar ve arkasinda hicbir aciklama birakmaz.
          DEADLINE=$(( $(date +%s) + 45 * 60 ))
          while [ ! -f "$CM_BUILD_DIR/$SHOTS_DIR/DONE" ]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "45 dakika doldu, DONE olusmadi — o ana kadar alinan"
              echo "goruntulerle devam ediliyor. Hic goruntu yoksa sonraki"
              echo "adim kosumu basarisiz sayacak."
              break
            fi
            sleep 15
          done
          if [ -f "$CM_BUILD_DIR/$SHOTS_DIR/DONE" ]; then
            echo "DONE goruldu, devam ediliyor."
          fi

      - name: Cozunurluk dogrulamasi
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          # maxdepth 1 ZORUNLU: screenshots/ altinda i18n-qa, raw ve
          # store-ready klasorleri var ve onlar Android QA goruntuleri —
          # baska cozunurluklerde. Ozyinelemeli bir arama, bu kosumun
          # urettigi goruntuler kusursuzken bile denetimi dusururdu.
          SHOTS=$(find "$SHOTS_DIR" -maxdepth 1 -type f -name '*.png' | sort)

          if [ -z "$SHOTS" ]; then
            echo "HATA: $SHOTS_DIR/ icinde hic PNG yok. Ekran goruntusu alinmamis."
            echo "Kosum 'Enable remote access' isaretli olarak mi baslatildi?"
            exit 1
          fi

          BAD=0
          COUNT=0
          echo ""
          echo "Alinan ekran goruntuleri:"
          for f in $SHOTS; do
            W=$(sips -g pixelWidth  "$f" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            COUNT=$((COUNT + 1))
            if [ "$W" = "$EXPECT_W" ] && [ "$H" = "$EXPECT_H" ]; then
              printf "  OK      %-28s %sx%s\n" "$(basename "$f")" "$W" "$H"
            else
              printf "  YANLIS  %-28s %sx%s (beklenen ${EXPECT_W}x${EXPECT_H})\n" "$(basename "$f")" "$W" "$H"
              BAD=$((BAD + 1))
            fi
          done
          echo ""
          echo "Toplam: $COUNT dosya, $BAD tanesi yanlis boyutta."

          if [ "$BAD" -ne 0 ]; then
            # Yanlis cozunurluk App Store'da YUKLEME aninda reddediliyor.
            # Burada basarili saymak, hatayi en pahali yere ertelemek olur.
            echo "HATA: yanlis cozunurlukte goruntu var — kosum basarisiz."
            exit 1
          fi
          echo "Butun goruntuler ${EXPECT_W}x${EXPECT_H}."

    artifacts:
      # Yalniz kok seviye: alt klasorlerdeki mevcut QA goruntuleri
      # bilerek disarida.
      - screenshots/*.png

    # publishing YOK — bu is akisi hicbir yere yukleme yapmaz.

  # ── iOS AdMob + UMP crash duman testi ───────────────────────────────
  #
  # SORU: iOS AdMob/UMP entegrasyonu uygulamayi acilista dusuruyor mu?
  #
  # Fiziksel iPhone yok, o yuzden cevap Simulator'dan alinacak. Diger uc
  # is akisiyla hicbir capa paylasmiyor ve imzalama/publishing/App Store
  # Connect entegrasyonu TASIMIYOR — simulator derlemesi imzasiz yapilir
  # ve bu is akisi hicbir yere yukleme yapmaz.
  #
  # ── BU TESTIN KANITLADIGI VE KANITLAMADIGI ────────────────────────
  # Kanitlar: uygulama aciliyor, 20 saniye AYAKTA kaliyor, cokme raporu
  # uretmiyor, WebView gercekten bir seyler ciziyor, ve native gunlukte
  # olumcul istisna yok.
  #
  # KANITLAMAZ: reklamin gosterildigini. Simulator'da reklam dolmayabilir
  # ve bu bir hata degil. Daha onemlisi, GADApplicationIdentifier'in
  # eksikligi ancak Mobile Ads SDK'si BASLATILDIGINDA cokme uretiyor;
  # SDK ise yalniz UMP canRequestAds=true derse baslatiliyor. Yani agin
  # ya da UMP yapilandirmasinin durumuna gore o yol hic yurumeyebilir.
  # Bu yuzden "AdMob initialize gozlendi mi" ayri bir satir olarak
  # RAPORLANIYOR ama kosumu DUSURMUYOR — ag kosullari yuzunden kirmizi
  # bir derleme, kodla ilgili hicbir sey soylemez.
  #
  # IOS_ADS_TEST_MODE=true kaliyor: yalniz Google'in demo birimleri.
  ios-admob-smoke:
    name: SlySwipe iOS — AdMob Simulator Smoke Test
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      # ios_signing YOK, integrations YOK, publishing YOK — bilerek.
      # xcode/cocoapods/node degerleri env_ios ile ayni tutulmali; capa
      # paylasilmadigi icin bu eslesme elle korunuyor.
      xcode: latest
      cocoapods: default
      node: 20
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.skyroonlabs.slyswipe"
        SMOKE_DIR: "smoke"
        ALIVE_WAIT_SEC: "20"
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Bagimliliklar (npm ci)
        script: |
          npm ci

      - name: Reklam ve iOS kapisi kosumlari
        script: |
          set -e
          # Derlemeden ONCE. Bir kimlik/kapi hatasini simulator'da cokme
          # olarak aramak, onu zaten sifir bagimlilikli Node ile saniyeler
          # icinde cevaplayabilecekken pahali ve belirsiz bir yol olurdu.
          node tools/ios-gating-test.js
          node tools/ad-release-test.js
          node tools/ad-consent-test.js
          node tools/interstitial-test.js

      - name: Web varliklari + cap sync ios
        script: |
          # npm run sync:ios = build-www.js + cap sync ios (pod install
          # dahil). `npx cap sync` dogrudan cagrilmiyor — o, www/'yi
          # yeniden uretmeden kopyalar.
          npm run sync:ios

      - name: Simulator sec ve baslat
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/$SMOKE_DIR"

          # Belirli bir model SART DEGIL: bu bir cokme testi, ekran
          # goruntusu uretimi degil (ios-screenshots orada iPhone 12 Pro
          # Max'i sart kosuyor cunku cozunurluk App Store'a giriyor).
          # Burada tek gereken calisan bir iPhone; model dayatmak, Xcode
          # surumu o cihazi kaldirdiginda testi kodla ilgisiz bir sebeple
          # kirmizi yapardi.
          UDID=$(xcrun simctl list devices available \
                 | grep -E "^[[:space:]]+iPhone .*\([0-9A-Fa-f-]{36}\)" \
                 | head -1 \
                 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')

          if [ -z "$UDID" ]; then
            echo "Hazir iPhone yok; olusturuluyor."
            DEVICE_TYPE=$(xcrun simctl list devicetypes \
                          | grep -o 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-[0-9A-Za-z-]*' \
                          | tail -1)
            RUNTIME=$(xcrun simctl list runtimes \
                      | grep -o 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]*' \
                      | tail -1)
            if [ -z "$DEVICE_TYPE" ] || [ -z "$RUNTIME" ]; then
              echo "HATA: bu Xcode altinda hicbir iPhone simulatoru olusturulamiyor."
              echo "  device type : ${DEVICE_TYPE:-BULUNAMADI}"
              echo "  runtime     : ${RUNTIME:-BULUNAMADI}"
              xcrun simctl list devicetypes | grep -i iphone || true
              xcrun simctl list runtimes || true
              exit 1
            fi
            UDID=$(xcrun simctl create "SlySwipe-Smoke" "$DEVICE_TYPE" "$RUNTIME")
          fi

          NAME=$(xcrun simctl list devices \
                 | grep -F "$UDID" \
                 | sed -E 's/^[[:space:]]*(.*) \([0-9A-Fa-f-]{36}\).*/\1/')

          echo "$UDID" > "$CM_BUILD_DIR/.smoke_udid"
          echo "$NAME" > "$CM_BUILD_DIR/.smoke_name"
          echo "Simulator : $NAME"
          echo "UDID      : $UDID"

          # bootstatus -b: kapaliysa acar ve acilis BITENE KADAR bekler.
          # Beklemeden install etmek "device not booted" ile duser.
          xcrun simctl bootstatus "$UDID" -b

      - name: Imzasiz Debug simulator derlemesi
        script: |
          set -e
          UDID=$(cat "$CM_BUILD_DIR/.smoke_udid")

          # CODE_SIGNING_ALLOWED=NO: bu is akisinin sertifika/profil
          # gerektirmemesinin tek sebebi bu satir.
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$CM_BUILD_DIR/ios/smokebuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$CM_BUILD_DIR/$SMOKE_DIR/build.log" | tail -40

          APP_PATH="$CM_BUILD_DIR/ios/smokebuild/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "HATA: derlenen .app bulunamadi: $APP_PATH"
            exit 1
          fi
          echo "$APP_PATH" > "$CM_BUILD_DIR/.smoke_app"

          # Paketlenen Info.plist'i DOGRULA. Depodaki dosyayi okumak
          # yeterli degil: asil soru derlemenin ciktisinda ne oldugu, ve
          # bu iki anahtarin yoklugu tam da aranan cokmelerin sebebi.
          BUILT_PLIST="$APP_PATH/Info.plist"
          GAD=$(/usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$BUILT_PLIST" 2>/dev/null || echo "")
          ATT=$(/usr/libexec/PlistBuddy -c "Print :NSUserTrackingUsageDescription" "$BUILT_PLIST" 2>/dev/null || echo "")
          echo "Paketlenen GADApplicationIdentifier       : ${GAD:-YOK}"
          echo "Paketlenen NSUserTrackingUsageDescription : ${ATT:+VAR}${ATT:-YOK}"
          if [ -z "$GAD" ]; then
            echo "HATA: GADApplicationIdentifier pakette YOK — Mobile Ads SDK acilista cokertir."
            exit 1
          fi
          if [ -z "$ATT" ]; then
            echo "HATA: NSUserTrackingUsageDescription pakette YOK — UMP izin istedigi anda uygulama sonlanir."
            exit 1
          fi
          echo "Derleme tamam: $APP_PATH"

      - name: Kur, gunlugu ac, baslat ve 20 saniye bekle
        script: |
          set -e
          UDID=$(cat "$CM_BUILD_DIR/.smoke_udid")
          APP_PATH=$(cat "$CM_BUILD_DIR/.smoke_app")
          SMOKE="$CM_BUILD_DIR/$SMOKE_DIR"

          xcrun simctl install "$UDID" "$APP_PATH"

          # Gunluk akisi BASLATMADAN ONCE aciliyor: aranan cokmelerin
          # hepsi acilis anindaki olaylar, sonradan toplanan bir gunluk
          # tam o pencereyi kacirirdi.
          #
          # Predicate ile daralttik: filtresiz bir akis 30 saniyede on
          # megabaytlarca satir uretiyor ve okunamayan bir artifact,
          # olmayan bir artifacttir.
          xcrun simctl spawn "$UDID" log stream --style compact --level info \
            --predicate 'processImagePath CONTAINS "App" OR processImagePath CONTAINS "WebContent" OR senderImagePath CONTAINS "GoogleMobileAds" OR senderImagePath CONTAINS "UserMessagingPlatform" OR eventMessage CONTAINS[c] "slyswipe" OR eventMessage CONTAINS "GAD" OR eventMessage CONTAINS "UMP" OR eventMessage CONTAINS[c] "consent" OR eventMessage CONTAINS[c] "tracking" OR eventMessage CONTAINS[c] "exception" OR eventMessage CONTAINS[c] "webcontent"' \
            > "$SMOKE/native.log" 2>&1 &
          LOGPID=$!
          echo "$LOGPID" > "$CM_BUILD_DIR/.smoke_logpid"
          sleep 2

          # simctl launch, uygulamanin HOST uzerindeki PID'ini yaziyor
          # (simulator uygulamalari gercek macOS surecleridir), yani
          # ayakta olup olmadigi duz `ps` ile sorulabilir.
          LAUNCH_OUT=$(xcrun simctl launch "$UDID" "$BUNDLE_ID" 2>&1) || {
            echo "HATA: uygulama BASLATILAMADI"
            echo "$LAUNCH_OUT"
            kill "$LOGPID" 2>/dev/null || true
            exit 1
          }
          echo "launch: $LAUNCH_OUT"
          PID=$(echo "$LAUNCH_OUT" | sed -E 's/.*:[[:space:]]*([0-9]+).*/\1/')
          echo "$PID" > "$CM_BUILD_DIR/.smoke_pid"
          echo "Uygulama PID: $PID"

          echo "Ayakta kalma penceresi: ${ALIVE_WAIT_SEC} saniye…"
          sleep "$ALIVE_WAIT_SEC"

          # Ekran goruntusu, sureci oldurmeden ONCE ve bekleme bittikten
          # SONRA: acilis sahnesi ~6 saniye surdugu icin daha erken bir
          # kare yalnizca splash'i gosterirdi.
          xcrun simctl io "$UDID" screenshot "$SMOKE/home.png" || true

          kill "$LOGPID" 2>/dev/null || true
          sleep 1
          echo "Gunluk satir sayisi: $(wc -l < "$SMOKE/native.log" | tr -d ' ')"

      - name: Surec ayakta mi + cokme raporu var mi
        script: |
          set -e
          UDID=$(cat "$CM_BUILD_DIR/.smoke_udid")
          PID=$(cat "$CM_BUILD_DIR/.smoke_pid")
          SMOKE="$CM_BUILD_DIR/$SMOKE_DIR"
          FAIL=0

          # ── 1. Surec hala yasiyor mu (ASIL SORU) ──
          if ps -p "$PID" > /dev/null 2>&1; then
            echo "OK    surec ${ALIVE_WAIT_SEC} saniye sonra AYAKTA (pid $PID)"
          else
            # Ikinci kanal: PID yakalama sed'i tutmadiysa yanlis alarm
            # vermeyelim. simctl'in kendi listesi bagimsiz bir cevap.
            if xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -qF "$BUNDLE_ID"; then
              echo "OK    surec ayakta (launchctl; pid okunamamisti)"
            else
              echo "HATA  surec ${ALIVE_WAIT_SEC} saniye dolmadan OLDU — cokme"
              FAIL=1
            fi
          fi

          # ── 2. Cokme raporu ──
          # Bir .ips dosyasi, gunlukteki herhangi bir desenden daha kesin
          # kanittir: yorum gerektirmez.
          mkdir -p "$SMOKE/crashes"
          FOUND=0
          # Liste ARA DOSYAYA yaziliyor, borudan okunmuyor: `find | while`
          # dongusu alt kabukta calisir ve iceride kurulan FOUND disariya
          # hic ulasmaz — cokme bulunup kosum yine yesil derdi. (Heredoc da
          # kullanilamaz: govdesi 0. sutuna dayandigi icin YAML blok
          # skalerini erken kapatiyor.)
          : > "$CM_BUILD_DIR/.smoke_ips"
          for d in "$HOME/Library/Logs/DiagnosticReports" "$HOME/Library/Logs/CoreSimulator/$UDID"; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 2 -name '*.ips' -mmin -20 2>/dev/null >> "$CM_BUILD_DIR/.smoke_ips" || true
          done
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$(basename "$f")" in
              App-*|SlySwipe*|*WebContent*|*com.skyroonlabs*)
                echo "HATA  cokme raporu: $f"
                cp "$f" "$SMOKE/crashes/" 2>/dev/null || true
                FOUND=1
                ;;
            esac
          done < "$CM_BUILD_DIR/.smoke_ips"
          if [ "$FOUND" -eq 0 ]; then
            echo "OK    ilgili cokme raporu yok"
          else
            FAIL=1
          fi

          echo "$FAIL" > "$CM_BUILD_DIR/.smoke_fail"
          exit 0

      - name: Native gunlukte olumcul desen taramasi
        script: |
          set -e
          SMOKE="$CM_BUILD_DIR/$SMOKE_DIR"
          LOG="$SMOKE/native.log"
          FAIL=$(cat "$CM_BUILD_DIR/.smoke_fail" 2>/dev/null || echo 0)
          [ -f "$LOG" ] || { echo "UYARI: gunluk dosyasi yok"; echo "$FAIL" > "$CM_BUILD_DIR/.smoke_fail"; exit 0; }

          # ── OLUMCUL: kosumu dusurur ──
          # Her biri "uygulama sonlandi" anlamina gelen, yoruma acik
          # olmayan imzalar. Ornegin cipla "GADApplicationIdentifier"
          # BILEREK burada degil: SDK o anahtari normal calismada da
          # anabiliyor, yani tek basina bir hata isareti degil. Eksikligin
          # imzasi GADInvalidInitializationException ve "without an
          # application ID" — olumcul olan bunlar.
          FATAL='NSInternalInconsistencyException|GADInvalidInitializationException|without an application ID|NSUserTrackingUsageDescription.*(must|required|missing)|Fatal Exception|\*\*\* Terminating app|EXC_BAD_ACCESS|EXC_CRASH|Abort trap|WebContent.*(crash|terminated)|Uncaught .*Exception'

          # ── DIKKAT: yalniz raporlanir ──
          # Bunlarin varligi normal olabilir; okunmasi gereken satirlar.
          WATCH='GADApplicationIdentifier|requestTrackingAuthorization|UMP|consent|ATTracking|Mobile Ads|SDKInitialization|JavaScript|WebContent'

          echo "── OLUMCUL desen taramasi ──"
          if grep -nEi "$FATAL" "$LOG" > "$SMOKE/fatal.txt" 2>/dev/null; then
            echo "HATA  olumcul desen bulundu:"
            head -30 "$SMOKE/fatal.txt"
            FAIL=1
          else
            echo "OK    olumcul desen yok"
            : > "$SMOKE/fatal.txt"
          fi

          echo
          echo "── DIKKAT satirlari (yalniz bilgi) ──"
          grep -nEi "$WATCH" "$LOG" 2>/dev/null | head -40 | tee "$SMOKE/watch.txt" || echo "  (eslesme yok)"

          # AdMob SDK gercekten baslatildi mi? Bu satirin YOKLUGU kosumu
          # DUSURMEZ (bkz. is akisi basligindaki not) ama testin ne kadar
          # sey kanitladigini soyleyen tek isaret bu.
          echo
          if grep -qEi 'Mobile Ads|GADMobileAds|SDKInitialization' "$LOG" 2>/dev/null; then
            echo "BILGI AdMob SDK baslatma izi GORULDU — GADApplicationIdentifier yolu yurudu."
          else
            echo "BILGI AdMob SDK baslatma izi YOK — muhtemelen UMP canRequestAds=false"
            echo "      dondu. Bu bir hata degil, ama bu kosum reklam yolunu"
            echo "      kanitlamamis oldu; ayakta kalma ve WebView sonuclari gecerli."
          fi

          echo "$FAIL" > "$CM_BUILD_DIR/.smoke_fail"
          exit 0

      - name: WebView gercekten cizdi mi (ekran goruntusu olcumu)
        script: |
          set -e
          SMOKE="$CM_BUILD_DIR/$SMOKE_DIR"
          FAIL=$(cat "$CM_BUILD_DIR/.smoke_fail" 2>/dev/null || echo 0)
          SHOT="$SMOKE/home.png"

          if [ ! -f "$SHOT" ]; then
            echo "UYARI: ekran goruntusu alinamadi — WebView dogrulanamadi"
            echo "$FAIL" > "$CM_BUILD_DIR/.smoke_fail"
            exit 0
          fi

          # "Surec ayakta" ile "ekranda bir sey var" AYNI SEY DEGIL: bos
          # bir WebView'la da uygulama saglikli gorunur. Duz renk bir kare
          # tam olarak bu durumun imzasi, ve olculebilir: kanal basina
          # standart sapma.
          #
          # sharp @capacitor/assets'in bagimliligi olarak npm ci ile
          # geliyor (devDependency), yani yeni bir bagimlilik eklenmedi.
          node -e '
            const sharp = require("sharp");
            const f = process.argv[1];
            sharp(f).stats().then((s) => {
              const dev = s.channels.slice(0, 3).map(c => c.stdev);
              const mean = s.channels.slice(0, 3).map(c => Math.round(c.mean));
              const maxDev = Math.max.apply(null, dev);
              console.log("  ortalama renk : rgb(" + mean.join(",") + ")");
              console.log("  std sapma     : " + dev.map(d => d.toFixed(1)).join(" / "));
              if (maxDev < 3) {
                console.log("HATA  ekran DUZ RENK — WebView hicbir sey cizmemis.");
                process.exit(2);
              }
              console.log("OK    WebView icerik cizmis (sapma > 3)");
            }).catch((e) => { console.log("UYARI olcum yapilamadi: " + e.message); process.exit(0); });
          ' "$SHOT" || {
            if [ $? -eq 2 ]; then FAIL=1; fi
          }

          echo "$FAIL" > "$CM_BUILD_DIR/.smoke_fail"
          exit 0

      - name: SONUC
        script: |
          SMOKE="$CM_BUILD_DIR/$SMOKE_DIR"
          FAIL=$(cat "$CM_BUILD_DIR/.smoke_fail" 2>/dev/null || echo 0)
          echo ""
          echo "═══════════════════════════════════════════════════"
          echo "  AdMob Simulator Smoke Test — OZET"
          echo "═══════════════════════════════════════════════════"
          echo "  simulator      : $(cat "$CM_BUILD_DIR/.smoke_name" 2>/dev/null)"
          echo "  udid           : $(cat "$CM_BUILD_DIR/.smoke_udid" 2>/dev/null)"
          echo "  bundle         : $BUNDLE_ID"
          echo "  bekleme        : ${ALIVE_WAIT_SEC} sn"
          echo "  gunluk satiri  : $(wc -l < "$SMOKE/native.log" 2>/dev/null | tr -d ' ')"
          echo "  olumcul satir  : $(wc -l < "$SMOKE/fatal.txt" 2>/dev/null | tr -d ' ')"
          echo "  cokme raporu   : $(ls "$SMOKE/crashes" 2>/dev/null | wc -l | tr -d ' ')"
          echo "  ekran goruntusu: $([ -f "$SMOKE/home.png" ] && echo var || echo yok)"
          echo "═══════════════════════════════════════════════════"
          if [ "$FAIL" -ne 0 ]; then
            echo "  SONUC: BASARISIZ — yukaridaki HATA satirlarina bak."
            exit 1
          fi
          echo "  SONUC: GECTI — acilis yolu crash-free."
          exit 0

    artifacts:
      - smoke/*.png
      - smoke/*.log
      - smoke/*.txt
      - smoke/crashes/*

    # publishing YOK — bu is akisi hicbir yere yukleme yapmaz.
